[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-super-secret-auth-token"
  organization = "ipset"
  bucket = "cm4000_data"

[[inputs.modbus]]
  name = "cm4000"
  slave_id = 1
  timeout = "1s"
  controller = "tcp://simulator:5020"
  configuration_type = "request"

  # TENSIONES L-L
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_voltage_ll"
    fields = [
      { address=1120, name="Vll_ab", type="UINT16" },
      { address=1121, name="Vll_bc", type="UINT16" },
      { address=1122, name="Vll_ca", type="UINT16" }
    ]

  # TENSIONES L-N
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_voltage_ln"
    fields = [
      { address=1124, name="Vln_a", type="UINT16" },
      { address=1125, name="Vln_b", type="UINT16" },
      { address=1126, name="Vln_c", type="UINT16" },
      { address=1128, name="Vln_avg", type="UINT16" }
    ]

  # CORRIENTES (Scale 10)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_current"
    fields = [
      { address=1100, name="I_a", type="UINT16", scale=0.1 },
      { address=1101, name="I_b", type="UINT16", scale=0.1 },
      { address=1102, name="I_c", type="UINT16", scale=0.1 },
      { address=1103, name="I_n", type="UINT16", scale=0.1 },
      { address=1105, name="I_avg", type="UINT16", scale=0.1 }
    ]

  # POTENCIA ACTIVA kW (INT16)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_power_active"
    fields = [
      { address=1140, name="kW_a", type="INT16" },
      { address=1141, name="kW_b", type="INT16" },
      { address=1142, name="kW_c", type="INT16" },
      { address=1143, name="kW_tot", type="INT16" }
    ]

  # POTENCIA REACTIVA kVAR (INT16)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_power_reactive"
    fields = [
      { address=1144, name="kVAR_a", type="INT16" },
      { address=1145, name="kVAR_b", type="INT16" },
      { address=1146, name="kVAR_c", type="INT16" },
      { address=1147, name="kVAR_tot", type="INT16" }
    ]

  # POTENCIA APARENTE kVA (INT16)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_power_apparent"
    fields = [
      { address=1148, name="kVA_a", type="INT16" },
      { address=1149, name="kVA_b", type="INT16" },
      { address=1150, name="kVA_c", type="INT16" },
      { address=1151, name="kVA_tot", type="INT16" }
    ]

  # FACTOR DE POTENCIA (INT16, Scale 1000)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_power_factor"
    fields = [
      { address=1160, name="PF_a", type="INT16", scale=0.001 },
      { address=1161, name="PF_b", type="INT16", scale=0.001 },
      { address=1162, name="PF_c", type="INT16", scale=0.001 },
      { address=1163, name="PF_tot", type="INT16", scale=0.001 }
    ]

  # FRECUENCIA (Scale 100)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_frequency"
    fields = [
      { address=1180, name="Freq", type="UINT16", scale=0.01 }
    ]

  # THD (Scale 10)
  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "cm4000_thd"
    fields = [
      { address=1190, name="THD_I_a", type="UINT16", scale=0.1 },
      { address=1191, name="THD_I_b", type="UINT16", scale=0.1 },
      { address=1192, name="THD_I_c", type="UINT16", scale=0.1 },
      { address=1193, name="THD_I_n", type="UINT16", scale=0.1 },
      { address=1200, name="THD_V_a", type="UINT16", scale=0.1 },
      { address=1201, name="THD_V_b", type="UINT16", scale=0.1 },
      { address=1202, name="THD_V_c", type="UINT16", scale=0.1 }
    ]
