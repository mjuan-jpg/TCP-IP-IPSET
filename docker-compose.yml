services:
  simulator:
    image: maximodockerhub/cm4000-simulator:latest
    container_name: cm4000_simulator
    ports:
      - "5020:5020"  # Modbus TCP
      - "5021:5021"  # Control TCP
    networks:
      - red_gestion
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: base_datos
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=ipset
      - DOCKER_INFLUXDB_INIT_BUCKET=cm4000_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./init-influxdb.sh:/docker-entrypoint-initdb.d/init-influxdb.sh:ro
    networks:
      - red_gestion
    restart: unless-stopped

  adquisidor:
    image: maximodockerhub/cm4000-adquisidor:latest
    container_name: adquisidor
    env_file:
      - .env
    depends_on:
      - simulator
      - influxdb
    volumes:
      - ./cm4000_client.py:/app/cm4000_client.py:ro
    networks:
      - red_gestion
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: dashboard
    user: "root"
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
      - prometheus
    networks:
      - red_gestion
    restart: unless-stopped

  # ── Observabilidad ─────────────────────────────────────────────
  # Usa la imagen oficial de cAdvisor pero con el flag correcto
  # para Debian 12 con overlayfs nativo: --raw_cgroup_prefix_whitelist
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--whitelisted_container_labels=com.docker.compose.service"
      - "--housekeeping_interval=10s"
    ports:
      - "8080:8080"
    networks:
      - red_gestion
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - cadvisor
    networks:
      - red_gestion
    restart: unless-stopped

networks:
  red_gestion:
    driver: bridge

volumes:
  influxdb_data:
  prometheus_data:
