- id: 'voltage_warn'
  alias: "Alerta: Tensión en Rango de Advertencia"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_voltage_phase_a
      above: 8001
    - platform: numeric_state
      entity_id: sensor.cm4000_voltage_phase_a
      below: 7239
  condition:
    - condition: numeric_state
      entity_id: sensor.cm4000_voltage_phase_a
      below: 8382
    - condition: numeric_state
      entity_id: sensor.cm4000_voltage_phase_a
      above: 6858
  action:
    - service: persistent_notification.create
      data:
        title: "⚠️ PRE-ALARMA: Tensión"
        message: "La tensión de la Fase A está fuera del +/- 5% nominal (7620V). Valor actual: {{ states('sensor.cm4000_voltage_phase_a') }} V"

- id: 'voltage_crit'
  alias: "Alerta: Tensión CRÍTICA"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_voltage_phase_a
      above: 8382
    - platform: numeric_state
      entity_id: sensor.cm4000_voltage_phase_a
      below: 6858
  action:
    - service: persistent_notification.create
      data:
        title: "🚨 ALARMA CRÍTICA: Tensión"
        message: "La tensión de la Fase A excedió el +/- 10% (EN 50160). Valor actual: {{ states('sensor.cm4000_voltage_phase_a') }} V"

- id: 'current_warn'
  alias: "Alerta: Sobrecorriente Advertencia"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_current_phase_a
      above: 100
  condition:
    - condition: numeric_state
      entity_id: sensor.cm4000_current_phase_a
      below: 110
  action:
    - service: persistent_notification.create
      data:
        title: "⚠️ PRE-ALARMA: Sobrecorriente"
        message: "Corriente > 100% In. Valor actual: {{ states('sensor.cm4000_current_phase_a') }} A"

- id: 'current_crit'
  alias: "Alerta: Sobrecorriente CRÍTICA"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_current_phase_a
      above: 110
  action:
    - service: persistent_notification.create
      data:
        title: "🚨 ALARMA CRÍTICA: Sobrecorriente"
        message: "Corriente > 110% In (Protección térmica inminente). Valor actual: {{ states('sensor.cm4000_current_phase_a') }} A"

- id: 'pf_warn'
  alias: "Alerta: FP Advertencia"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_power_factor
      below: 0.95
  condition:
    - condition: numeric_state
      entity_id: sensor.cm4000_power_factor
      above: 0.90
  action:
    - service: persistent_notification.create
      data:
        title: "⚠️ PRE-ALARMA: Factor de Potencia"
        message: "El FP cayó por debajo de 0.95. Valor actual: {{ states('sensor.cm4000_power_factor') }}"

- id: 'pf_crit'
  alias: "Alerta: FP CRÍTICO"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_power_factor
      below: 0.90
  action:
    - service: persistent_notification.create
      data:
        title: "🚨 ALARMA CRÍTICA: Factor de Potencia"
        message: "Riesgo de Penalizaciones. FP por debajo de 0.90. Valor actual: {{ states('sensor.cm4000_power_factor') }}"

- id: 'thdv_warn'
  alias: "Alerta: THD Tensión Advertencia"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_thd_voltage_phase_a
      above: 5
  condition:
    - condition: numeric_state
      entity_id: sensor.cm4000_thd_voltage_phase_a
      below: 8
  action:
    - service: persistent_notification.create
      data:
        title: "⚠️ PRE-ALARMA: THD Tensión"
        message: "THD de Tensión superior al 5%. Valor actual: {{ states('sensor.cm4000_thd_voltage_phase_a') }} %"

- id: 'thdv_crit'
  alias: "Alerta: THD Tensión CRÍTICO"
  trigger:
    - platform: numeric_state
      entity_id: sensor.cm4000_thd_voltage_phase_a
